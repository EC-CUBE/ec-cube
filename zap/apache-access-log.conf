# スキャン中のアクセスログに、リダイレクト先 (Location) を足す。
# attacks.tsv で 3xx を行き先ごとに数え、保存に成功したリダイレクトと、ログイン画面やエラー画面へ
# 戻されたリダイレクト (攻撃が処理まで届いていない) を区別するため (zap/bin/attack_counts.sh)。
# apache2.conf の LogFormat の定義より後に読み込まれる conf-enabled に置き、combined を上書きする。
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" \"%{Location}o\"" combined
