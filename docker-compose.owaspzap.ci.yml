services:
  # docker-compose.yml が APP_ENV: dev を直書きしているため、ここで prod に上書きする
  # (シェルの環境変数では上書きされない)
  ec-cube:
    environment:
      APP_ENV: "prod"
      APP_DEBUG: 0
      # セキュリティ設定 (admin_security) への攻撃で .env の IP 制限や管理画面のパスが書き換わり、
      # 以降のリクエストが締め出されないよう、既定値のまま環境変数で固定する。
      # 環境変数で上書きされたキーは、画面から保存しても .env へ書き込まれない
      ECCUBE_FRONT_ALLOW_HOSTS: "[]"
      ECCUBE_FRONT_DENY_HOSTS: "[]"
      ECCUBE_ADMIN_ALLOW_HOSTS: "[]"
      ECCUBE_ADMIN_DENY_HOSTS: "[]"
      ECCUBE_FORCE_SSL: "0"
      # 画面では必須のため空にできない。すべてのホストに一致させ、未設定と同じ動作にする
      TRUSTED_HOSTS: ".*"
      ECCUBE_ADMIN_ROUTE: "admin"

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    
    # コンテナを待機させる
    entrypoint: ["sh", "-c"]
    command: ["tail -f /dev/null"]
    
    environment:
      # HOMEは公式が /home/zap を前提にしているため明示しておくと安全
      HOME: /home/zap

    volumes:
      - ./zap:/zap/wrk/
    depends_on:
      - ec-cube
    networks:
      - backend
      - default
    tty: true
    healthcheck:
      test: echo 'zap'
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 5s