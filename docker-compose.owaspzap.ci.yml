version: "3"

services:
  zap:
    image: ghcr.io/ec-cube/zaproxy:0.1.0
    # ENTRYPOINT を無効化
    entrypoint: ["sh", "-c"]
    # コンテナを待機させる
    command: ["tail -f /dev/null"]
    volumes:
      - ./zap/policies:/home/zap/.ZAP/policies/
      - ./zap:/zap/wrk/
    depends_on:
      - ec-cube
    networks:
      - backend
      - default
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "test -f /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 3