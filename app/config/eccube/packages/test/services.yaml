services:
    # DBAL 3 の SQLLogger / DebugStack 廃止に伴い, テストでのクエリ数カウントを
    # DBAL 4 の Logging\Middleware + 集計ロガーで代替する.
    Eccube\Tests\Doctrine\Logging\QueryCountLogger:
        public: true

    eccube.tests.doctrine.query_count_middleware:
        class: Doctrine\DBAL\Logging\Middleware
        arguments:
            - '@Eccube\Tests\Doctrine\Logging\QueryCountLogger'
        tags:
            - { name: doctrine.middleware }
