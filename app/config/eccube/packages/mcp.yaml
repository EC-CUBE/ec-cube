mcp:
    servers:
        # サーバ名。 mcp-bundle はこの名前からサービス ID (mcp.server.eccube.*) とルート名を組む。
        # PHP 側の参照は Eccube\Service\Mcp\McpServerDefinition に集約している。
        eccube:
            name: 'EC-CUBE MCP Server'
            version: '4.4.0'
            description: 'EC-CUBE 4.4 の管理データ (商品/在庫・注文・顧客会員・プラグイン管理) を AI クライアントから自然言語で参照する読み取り専用 MCP サーバ。 認証認可は API プラグイン (api44) の OAuth2 / scope に委譲する。'
            transports:
                http: true
                stdio: true
            http:
                path: '/%eccube_admin_route%/mcp'
                # mcp/sdk の DNS リバインディング対策 (DnsRebindingProtectionMiddleware) を外す。
                # 未設定 (null) だと SDK 既定の localhost / 127.0.0.1 / [::1] だけが許可され、 独自ドメインや
                # Docker のホスト名では全リクエストが 403 (Forbidden: Invalid Host header.) になる。
                # 店舗ごとに異なるホスト名をここへ列挙させる代わりに、 次の 3 点で同等以上の防御を担保している:
                #   - Origin / Content-Type の検査は EC-CUBE 側の Eccube\EventListener\Mcp\OriginContentTypeListener が行う
                #     (prod では許可リスト ECCUBE_MCP_ALLOWED_ORIGINS に無い Origin 付き = ブラウザ発のリクエストを 403)
                #   - MCP は Bearer トークン必須で、 ブラウザが自動で付与する Cookie 等の認証情報では到達できない
                #   - Host の検証は TRUSTED_HOSTS (Request::setTrustedHosts) で全リクエストに掛けられる
                allowed_hosts: false
            session:
                store: file
                # MCP セッションはリクエスト処理中に書き込まれるため, ランタイムディレクトリへ置く.
                # (既定は %kernel.cache_dir%/mcp-sessions/<サーバ名>)
                directory: '%eccube_runtime_dir%/mcp-sessions'
            # 公開するのは Tool だけ。 scope 検査 (ScopeEnforcingReferenceHandler / ScopeFilteringRegistry) は
            # Tool にしか掛からないため、 prompts / resources / resource_templates / apps はこのサーバに登録しない
            registry:
                tools: '*'
