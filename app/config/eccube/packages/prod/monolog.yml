monolog:
    handlers:
        # Main handler: only ERROR and WARNING levels
        # Excludes doctrine, event, php channels to reduce log volume by 99%
        main:
            type: fingers_crossed
            action_level: error
            handler: main_rotating_file
            excluded_http_codes: [404, 405]
            buffer_size: 50
            channels: ['!doctrine', '!event', '!php', '!cookie_consent']
        main_rotating_file:
            type: rotating_file
            max_files: 60
            path: '%kernel.logs_dir%/%kernel.environment%/site.log'
            formatter: eccube.log.formatter.line
            level: warning
        # Front: ERROR and WARNING only
        front:
            type: fingers_crossed
            action_level: error
            handler: front_rotating_file
            channels: ['front', 'app']
            excluded_http_codes: [404, 405]
            buffer_size: 50
        front_rotating_file:
            type: rotating_file
            max_files: 60
            path: '%kernel.logs_dir%/%kernel.environment%/front.log'
            formatter: eccube.log.formatter.line
            level: warning
        # Admin: ERROR and WARNING only
        admin:
            type: fingers_crossed
            action_level: error
            handler: admin_rotating_file
            channels: ['admin', 'app']
            excluded_http_codes: [404, 405]
            buffer_size: 50
        admin_rotating_file:
            type: rotating_file
            max_files: 60
            path: '%kernel.logs_dir%/%kernel.environment%/admin.log'
            formatter: eccube.log.formatter.line
            level: warning
        # Cookie consent: 同意操作の証跡。fingers_crossed を経由せず info レベルで直接出力する。
        # 同意 Cookie の寿命（365日）に合わせて保持し、コア既定ログ（60日）とは分離する。
        cookie_consent:
            type: rotating_file
            max_files: 365
            path: '%kernel.logs_dir%/%kernel.environment%/cookie_consent.log'
            formatter: eccube.log.formatter.line
            level: info
            channels: ['cookie_consent']
        # Console: WARNING and above only
        console:
            type: console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!cookie_consent']
            level: warning
