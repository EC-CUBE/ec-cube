services:
    _defaults:
        public: true

    session:
        class: Eccube\Session\Session
        autowire: true
    # テスト時はCsrfTokenManagerはMockを利用する
    security.csrf.token_manager:
        class: Eccube\Tests\Mock\CsrfTokenManagerMock
        public: true
    # テスト時はTransactionListenerを無効にする
    Eccube\EventListener\TransactionListener:
        arguments:
            - '@doctrine.orm.default_entity_manager'
            - false
    # セッションの保存先をvar/sessions/testに変更する
    session.storage.factory.mock_file:
        class: 'Symfony\Component\HttpFoundation\Session\Storage\MockFileSessionStorageFactory'
        arguments:
            - '%session.save_path%'
            - 'MOCKSESSID'
    Eccube\Service\PurchaseFlow\Processor\DeliveryFeePreprocessor:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\PaymentChargePreprocessor:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\StockMultipleValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\SaleLimitMultipleValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\StockReduceProcessor:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\StockValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\TaxProcessor:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\AddPointProcessor:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\DeliverySettingValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\EmptyItemsValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\PaymentTotalLimitValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\PointDiffProcessor:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\PriceChangeValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\ProductStatusValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\StockDiffProcessor:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\ClassCategoryValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\PaymentTotalNegativeValidator:
        autowire: true
        public: true
    Eccube\Service\PurchaseFlow\Processor\PointRateProcessor:
        autowire: true
        public: true
    Eccube\Service\Composer\ComposerApiService:
        autowire: true
        public: true
    # AddressMappingService はまだ consumer が無く private では除去されるためテスト時のみ public 化
    Eccube\Service\AgentCommerce\AddressMappingService:
        autowire: true
        public: true
    # CheckoutSession 中核 (#6777 Phase 1b) も consumer (checkout controller) が #6776/#6574 まで
    # 無いため、テスト時のみ public 化してコンテナから取得する。
    Eccube\Service\AgentCommerce\AgentCheckoutPurchaseFlowAdapter:
        autowire: true
        public: true
        # 明示定義により _defaults の $shoppingPurchaseFlow bind が外れるため、ここで再束縛する。
        arguments:
            $shoppingPurchaseFlow: '@eccube.purchase.flow.shopping'
    Eccube\Service\AgentCommerce\Fulfillment\StandardFulfillmentOptionMapper:
        autowire: true
        public: true
    Eccube\Service\AgentCommerce\CheckoutSession\GuestCustomerResolver:
        autowire: true
        public: true
    # UCP checkout (#6574) サービス群。テストからコンテナ取得するため public 化する。
    Eccube\Service\AgentCommerce\Ucp\UcpCheckoutSessionMapper:
        autowire: true
        public: true
    Eccube\Service\AgentCommerce\Ucp\UcpMessageMapper:
        autowire: true
        public: true
    Eccube\Service\AgentCommerce\Ucp\UcpStatusMapper:
        autowire: true
        public: true
    Eccube\Service\AgentCommerce\Ucp\Signature\Rfc9421SignatureBaseBuilder:
        autowire: true
        public: true
    Eccube\Service\AgentCommerce\Ucp\Signature\UcpProfileFetcher:
        autowire: true
        public: true
    Eccube\Service\AgentCommerce\Ucp\Signature\UcpRequestSignatureVerifier:
        autowire: true
        public: true
        arguments:
            $allowedDomains: []
    Eccube\Service\AgentCommerce\Idempotency\AgentCheckoutIdempotencyStore:
        autowire: true
        public: true
        arguments:
            $cache: '@cache.app'
    Eccube\Service\AgentCommerce\Payment\AgentCheckoutPaymentHandlerRegistry:
        autowire: true
        public: true
        arguments:
            $handlers: !tagged_iterator agent_commerce.payment_handler
    Eccube\Service\AgentCommerce\StorefrontUrlResolver:
        autowire: true
        public: true
