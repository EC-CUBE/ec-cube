version: 2
updates:
  # ------------------------------------------------------------------
  # PHP (composer)
  # ------------------------------------------------------------------
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    allow:
      - dependency-type: "all"
    # グループは上から順に評価され、依存は最初にマッチした 1 つのグループにだけ入る。
    # どのグループにもマッチしない更新 (= major) は、従来どおり個別の PR になる。
    groups:
      # require-dev。CI が通れば実質そのままマージできる
      php-dev-tools:
        dependency-type: "development"
        update-types: [ "minor", "patch" ]
      # Symfony は同時リリースでバージョンが揃うため 1 本にまとめる
      symfony:
        patterns: [ "symfony/*" ]
        update-types: [ "minor", "patch" ]
      doctrine:
        patterns: [ "doctrine/*" ]
        update-types: [ "minor", "patch" ]
      # 上記以外の production。exclude-patterns は評価順に依存しないための保険
      php-production:
        patterns: [ "*" ]
        exclude-patterns: [ "symfony/*", "doctrine/*" ]
        update-types: [ "minor", "patch" ]

  # ------------------------------------------------------------------
  # GitHub Actions
  # ------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # ------------------------------------------------------------------
  # npm (ルート: 管理画面・店頭アセット)
  # ------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    allow:
      - dependency-type: "all"
    groups:
      # 画面に描画されるライブラリ。目視確認が要るのはこの 1 本だけにする
      npm-frontend:
        patterns:
          - "@popperjs/core"
          - "ace-builds"
          - "bootstrap"
          - "chart.js"
          - "filepond"
          - "filepond-plugin-*"
          - "jquery"
          - "jquery-ui"
          - "jquery.qrcode"
          - "ladda"
          - "normalize.css"
          - "slick-carousel"
          - "spin.js"
        update-types: [ "minor", "patch" ]
      # ビルドツールと間接依存 (package-lock.json のみの更新)
      npm-build:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # ------------------------------------------------------------------
  # npm (E2E: Playwright)
  # ------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    allow:
      - dependency-type: "all"
    groups:
      # グループ名に数字は使えないため "e2e" ではなく "playwright"
      playwright:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
