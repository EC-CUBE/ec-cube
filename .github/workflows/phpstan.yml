name: PHPStan

on:
  workflow_call:

jobs:
  phpstan:
    name: PHPStan

    runs-on: ubuntu-latest

    steps:
    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Setup PHP
      uses: nanasess/setup-php@master
      with:
        php-version: '8.3'

    - name: Install ext-redis 6.1+
      run: |
        sudo apt-get update
        sudo apt-get install -y php8.3-redis
        sudo phpenmod -s cli redis
        REDIS_VERSION=$(php -r "echo phpversion('redis');" 2>/dev/null || echo "0")
        echo "Installed ext-redis version: $REDIS_VERSION"
        php -m | grep -i redis

    - name: Initialize Composer
      uses: ./.github/actions/composer

    - name: PHPStan
      run: vendor/bin/phpstan analyze src/ --error-format=github
