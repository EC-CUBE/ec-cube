name: PHPStan

on:
  workflow_call:

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan

    runs-on: ubuntu-latest

    steps:
    - name: "Checkout"
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: '8.5'
        extensions: redis

    - name: Initialize Composer
      uses: ./.github/actions/composer

    - name: Restore PHPStan cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
      with:
        path: /tmp/phpstan
        key: ${{ runner.os }}-phpstan-${{ hashFiles('phpstan.neon.dist', 'composer.lock', 'src/**/*.php') }}
        restore-keys: |
          ${{ runner.os }}-phpstan-

    - name: PHPStan
      run: vendor/bin/phpstan analyze src/ --error-format=github

    - name: Save PHPStan cache
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
      with:
        path: /tmp/phpstan
        key: ${{ runner.os }}-phpstan-${{ hashFiles('phpstan.neon.dist', 'composer.lock', 'src/**/*.php') }}
