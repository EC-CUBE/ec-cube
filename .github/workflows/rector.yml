name: Rector

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rector:
    name: Rector

    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2
        with:
          php-version: '8.5'
          github-token: ''

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Warmup cache (dev)
        run: bin/console cache:warmup --env=dev
        env:
          APP_ENV: dev

      - name: Restore Rector cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: var/rector_cache
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.lock') }}

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --ansi --config=rector.php

      - name: Save Rector cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: var/rector_cache
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.lock') }}
