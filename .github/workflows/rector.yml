name: Rector

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rector:
    name: Rector

    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.5'
          github-token: ''

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Warmup cache (dev)
        run: bin/console cache:warmup --env=dev
        env:
          APP_ENV: dev

      - name: Restore Rector cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: var/rector_cache
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.lock') }}

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --ansi --config=rector.php

      - name: Save Rector cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: var/rector_cache
          key: ${{ runner.os }}-rector-${{ hashFiles('rector.php', 'composer.lock') }}
