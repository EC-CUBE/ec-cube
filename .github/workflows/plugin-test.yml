        db: [ pgsql, mysql ]
        method:
          - test_dependency_each_install_plugin
          - test_dependency_plugin_install
          - test_dependency_plugin_update
          - test_install_error
          - install_enable_disable_enable_disable_remove_store
          - test_enhance_plugin_entity
        include:
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 18
            database_charset: utf8
          - db: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_server_version: 8
            database_charset: utf8mb4
        exclude:
          - db: mysql
            method: test_dependency_plugin_update

    services:
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1080:1080
          - 1025:1025

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      ## Docker Hub からの pull はタイムアウトで CI が不安定になるため、
      ## DB はコンテナではなく setup アクション (apt) でインストールする
      - name: Setup MySQL
        if: matrix.db == 'mysql'
        uses: ankane/setup-mysql@7fef9e1e6d7041dccbe4cda8e2c5940e49db8f30  # v1
        with:
          mysql-version: '8.4'
      - name: Configure MySQL
        if: matrix.db == 'mysql'
        run: |
          for _ in $(seq 1 30); do mysqladmin ping -h 127.0.0.1 --silent && break; sleep 1; done
          mysqladmin ping -h 127.0.0.1 --silent || { echo 'MySQL did not become ready within 30s'; exit 1; }
          ## DATABASE_URL は TCP(127.0.0.1) 接続のため、TCP 経路でアクセスする root@'%' にも認証情報を設定する
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY 'password'; CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH caching_sha2_password BY 'password'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          ## DATABASE_URL と同一経路 (TCP/root/password) で接続できることを検証
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e 'SELECT VERSION()'

      - name: Setup PostgreSQL
        if: matrix.db == 'pgsql'
        uses: ankane/setup-postgres@6d3ffa1aa7498a42b79e9f9f5838b99971839300  # v1
        with:
          postgres-version: '18'
          user: postgres
      - name: Configure PostgreSQL
        if: matrix.db == 'pgsql'
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"
          ## DATABASE_URL と同一経路 (TCP/postgres/password) で接続できることを検証
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -c 'SELECT VERSION()'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Generate ECCUBE_AUTH_MAGIC
        run: echo "ECCUBE_AUTH_MAGIC=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Setup to EC-CUBE
        env:
          APP_ENV: 'e2e'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          echo "APP_ENV=${APP_ENV}" > .env
          echo "ECCUBE_AUTH_MAGIC=${ECCUBE_AUTH_MAGIC}" >> .env
          bin/console doctrine:database:create
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load

      - name: Cache apt packages
        if: matrix.db == 'pgsql'
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # latest
        with:
          packages: postgresql-client
          version: 1.0

      - name: Update baseinfo with pgsql
        if: matrix.db == 'pgsql'
        env:
          PGPASSWORD: 'password'
        run: psql eccube_db -h 127.0.0.1 -U postgres -c "update dtb_base_info set authentication_key='test';"

      - name: Update baseinfo with mysql
        if: matrix.db == 'mysql'
        run: mysql -h 127.0.0.1 -u root -ppassword eccube_db -e "update dtb_base_info set authentication_key='test';"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Start PHP Development Server
        env:
          APP_ENV: 'e2e'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          MAILER_URL: 'smtp://127.0.0.1:1025'
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: php -S 127.0.0.1:8000 codeception/router.php &

      - name: Run package-api
        run: |
          if [[ ! -d ${PWD}/repos ]]; then mkdir -p ${PWD}/repos ; fi
          docker run -d --rm -v ${PWD}/repos:/repos -e MOCK_REPO_DIR=/repos -p 8080:8080 eccube/mock-package-api:composer2

      - name: Playwright
        working-directory: e2e
        run: npx playwright test plugin-depend --grep "${METHOD}"
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          BASE_URL: 'http://127.0.0.1:8000'
          ECCUBE_PROJECT_DIR: ${{ github.workspace }}
          ECCUBE_ADMIN_ROUTE: admin
          REPOS_DIR: ${{ github.workspace }}/repos
          PLUGIN_DATA_DIR: ${{ github.workspace }}/codeception/_data/plugins
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          METHOD: ${{ matrix.method }}

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: plugin-depend-${{ matrix.method }}-${{ matrix.db }}-traces
          path: e2e/test-results/
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: plugin-depend-${{ matrix.method }}-${{ matrix.db }}-logs
