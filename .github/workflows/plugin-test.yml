  plugin-extend:
    name: Plugin extend
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-24.04 ]
        php: ${{ fromJSON(inputs.php-versions) }}
        db: [ pgsql, mysql ]
        method:
          - test_extend_same_table_store
          - test_extend_same_table_disabled_remove_store
          - test_extend_same_table_local
          - test_extend_same_table_disabled_remove_local
          - test_extend_same_table_crossed_store
          - test_extend_same_table_crossed_local
        include:
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 18
            database_charset: utf8
          - db: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_server_version: 8
            database_charset: utf8mb4

    services:
      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1080:1080
          - 1025:1025

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      ## Docker Hub からの pull はタイムアウトで CI が不安定になるため、
      ## DB はコンテナではなく setup アクション (apt) でインストールする
      - name: Setup MySQL
        if: matrix.db == 'mysql'
        uses: ankane/setup-mysql@7fef9e1e6d7041dccbe4cda8e2c5940e49db8f30  # v1
        with:
          mysql-version: '8.4'
      - name: Configure MySQL
        if: matrix.db == 'mysql'
        run: |
          for _ in $(seq 1 30); do mysqladmin ping -h 127.0.0.1 --silent && break; sleep 1; done
