name: E2E test for EC-CUBE

on:
  workflow_call:
    inputs:
      php-versions:
        description: 'テスト対象 PHP バージョンの JSON 配列'
        type: string
        default: "['8.2', '8.3', '8.4', '8.5']"
  workflow_dispatch:
    inputs:
      php-versions:
        description: 'テスト対象 PHP バージョンの JSON 配列'
        type: string
        default: "['8.2', '8.3', '8.4', '8.5']"

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        db: [ pgsql ]
        suite:
          - admin-top
          - admin-auth
          - admin-product
          - admin-order
          - admin-shipping
          - admin-customer
          - admin-contents
          - admin-basicinfo
          - admin-system
          - front-top
          - front-product
          - front-customer
          - front-other
          - front-order
          - front-mypage
          - front-invoice
          - front-mail
          - front-password-nist
        include:
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 18

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      ## Docker Hub からの pull はタイムアウトで CI が不安定になるため、
      ## DB はコンテナではなく setup アクション (apt) でインストールする
      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@6d3ffa1aa7498a42b79e9f9f5838b99971839300  # v1
        with:
          postgres-version: '18'
          user: postgres
      - name: Configure PostgreSQL
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"
          ## DATABASE_URL と同一経路 (TCP/postgres/password) で接続できることを検証
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -c 'SELECT VERSION()'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis

      - name: Enable register_argc_argv for Codeception
        if: matrix.php == '8.5'
        run: |
          INI_FILE=$(php --ini | grep "Loaded Configuration" | sed -e "s|.*:\s*||" | tr -d '"')
          echo "Using php.ini: $INI_FILE"
          echo "register_argc_argv = On" | sudo tee -a "$INI_FILE"
          php -i | grep register_argc_argv

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Generate ECCUBE_AUTH_MAGIC
        run: echo "ECCUBE_AUTH_MAGIC=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Cache npm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        id: build-cache
        with:
          path: |
            html/template/**/css
            html/bundle
          key: ${{ runner.os }}-build-${{ hashFiles('html/template/**/scss/**/*.scss', 'html/template/**/js/**/*.js', 'package-lock.json', 'gulpfile.js', 'webpack.config.js', 'gulp/**/*.js') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build Sass and JavaScript
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build

      - name: Setup to EC-CUBE
        env:
          APP_ENV: 'codeception'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          echo "APP_ENV=${APP_ENV}" > .env
          echo "TRUSTED_HOSTS=127.0.0.1,localhost" >> .env
          echo "ECCUBE_AUTH_MAGIC=${ECCUBE_AUTH_MAGIC}" >> .env
          bin/console doctrine:database:create --env=dev
          bin/console doctrine:schema:create --env=dev
          bin/console eccube:fixtures:load --env=dev

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@681749ae568c81c2037cb9185e38b709b261bd2f  # latest
        with:
          packages: fonts-ipafont fonts-ipaexfont
          version: 1.0

      - name: Start Mailpit (SMTP sink)
        uses: ./.github/actions/mailpit

      - name: Start PHP Development Server
        env:
          APP_ENV: 'codeception'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          MAILER_DSN: 'smtp://127.0.0.1:1025'
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: php -S 127.0.0.1:8000 codeception/router.php &

      - name: Determine Playwright project
        id: project
        run: |
          SUITE="${{ matrix.suite }}"
          if [[ "$SUITE" == admin-* ]]; then
            echo "project=admin-tests" >> $GITHUB_OUTPUT
          elif [[ "$SUITE" == front-* ]]; then
            echo "project=front-tests" >> $GITHUB_OUTPUT
          fi

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: 'http://127.0.0.1:8000'
          MAILPIT_URL: 'http://127.0.0.1:8025'
          DATABASE_URL: ${{ matrix.database_url }}
          ECCUBE_ADMIN_ROUTE: 'admin'
          ADMIN_USER: 'admin'
          ADMIN_PASSWORD: 'password'
          APP_ENV: 'codeception'
          CI: 'true'
        run: |
          npx playwright test --project=setup --project=${{ steps.project.outputs.project }} ${{ matrix.suite }}.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-${{ matrix.suite }}-report
          path: e2e/playwright-report/

      - name: Upload ScreenShots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-${{ matrix.suite }}-results
          path: e2e/test-results/

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-${{ matrix.suite }}-logs
          path: var/log/

  ## MCP の Playwright E2E。 トークン発行 UI → Bearer で /admin/mcp にツール呼び出し、 の経路を通す。
  ## MCP は Api44 (OAuth2 / scope / firewall) 前提のため、 メインの playwright マトリクスとは別に、
  ## Api44 を導入した専用環境で mcp.spec.ts を実走する (Api44 導入手順は unit-test.yml の mcp ジョブと同じ)。
  ## 環境は既存 playwright ジョブと同じ混成 (.env=codeception / スキーマ・fixtures・Api44 導入は --env=dev)。
  ## ブラウザ経由の admin ログインが通る実績のある構成に合わせる。
  mcp:
    name: Playwright (mcp)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      ## MCP の scope 認可と /admin/mcp 用 OAuth2 firewall は Api44 の feat/mcp-server-scorp に実装されており、
      ## eccube-api4 の 4.4 にはまだ無い。 当該ブランチが 4.4 にマージされたら ref を '4.4' に戻すこと。
      - name: Checkout Api44 plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          repository: 'EC-CUBE/eccube-api4'
          ref: 'feat/mcp-server-scorp'
          path: 'eccube-api4'

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@6d3ffa1aa7498a42b79e9f9f5838b99971839300  # v1
        with:
          postgres-version: '16'
          user: postgres
      - name: Configure PostgreSQL
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
        with:
          php-version: '8.3'
          github-token: ''
          extensions: :xdebug, redis

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v4
        with:
          node-version: 20

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Generate ECCUBE_AUTH_MAGIC
        run: echo "ECCUBE_AUTH_MAGIC=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build Sass and JavaScript
        run: |
          npm ci
          npm run build

      - name: Setup mock-package-api
        run: |
          ( cd eccube-api4 && tar cvzf "$GITHUB_WORKSPACE/Api44.tar.gz" ./* )
          mkdir -p /tmp/repos
          cp "$GITHUB_WORKSPACE/Api44.tar.gz" /tmp/repos/Api44.tgz
          docker run --name package-api -d -v /tmp/repos:/repos -e MOCK_REPO_DIR=/repos -p 8080:8080 eccube/mock-package-api:composer2

      # 既存 playwright ジョブと同じ混成: .env は codeception、 スキーマ/fixtures/Api44 導入は
      # --env=dev で流す (ブラウザ経由 admin ログインが通る実績のある構成)。
      - name: Setup EC-CUBE
        env:
          APP_ENV: 'codeception'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          DATABASE_SERVER_VERSION: 16
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          echo "APP_ENV=${APP_ENV}" > .env
          echo "TRUSTED_HOSTS=127.0.0.1,localhost" >> .env
          echo "ECCUBE_AUTH_MAGIC=${ECCUBE_AUTH_MAGIC}" >> .env
          bin/console doctrine:database:create --env=dev
          bin/console doctrine:schema:create --env=dev
          bin/console eccube:fixtures:load --env=dev

      - name: Install Api44
        env:
          APP_ENV: 'dev'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          DATABASE_SERVER_VERSION: 16
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          USE_SELFSIGNED_SSL_CERTIFICATE: '1'
        run: |
          bin/console doctrine:query:sql "update dtb_base_info set authentication_key='dummy'" --env=dev
          bin/console eccube:composer:require ec-cube/api44 --env=dev
          bin/console eccube:plugin:enable --code=Api44 --env=dev
          bin/console doctrine:schema:update --force --dump-sql --env=dev
          bin/console cache:clear --no-warmup --env=dev
          chmod 600 app/PluginData/Api44/oauth/private.key

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start PHP Development Server
        env:
          APP_ENV: 'codeception'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          DATABASE_SERVER_VERSION: 16
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: php -S 127.0.0.1:8000 codeception/router.php &

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: 'http://127.0.0.1:8000'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          ECCUBE_ADMIN_ROUTE: 'admin'
          ADMIN_USER: 'admin'
          ADMIN_PASSWORD: 'password'
          APP_ENV: 'codeception'
          CI: 'true'
        run: npx playwright test --project=setup --project=mcp-tests mcp.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-mcp-report
          path: e2e/playwright-report/

      - name: Upload ScreenShots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-mcp-results
          path: e2e/test-results/

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-mcp-logs
          path: var/log/
