name: E2E test for EC-CUBE

on:
  workflow_call:
    inputs:
      php-versions:
        description: 'テスト対象 PHP バージョンの JSON 配列'
        type: string
        default: "['8.2', '8.3', '8.4', '8.5']"
  workflow_dispatch:
    inputs:
      php-versions:
        description: 'テスト対象 PHP バージョンの JSON 配列'
        type: string
        default: "['8.2', '8.3', '8.4', '8.5']"

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    ## workflow_dispatch (手動実行) では installer ジョブのみを回し、全 spec の
    ## 実行は行わない (インストーラの動作確認だけを安価に回すため)。
    ## push / pull_request (main.yml からの呼び出し) では従来どおり全 spec を実行する。
    if: ${{ github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        db: [ pgsql ]
        suite:
          - admin-top
          - admin-auth
          - admin-product
          - admin-order
          - admin-shipping
          - admin-customer
          - admin-contents
          - admin-basicinfo
          - admin-system
          - admin-store
          - admin-refund-request
          - front-top
          - front-product
          - front-customer
          - front-other
          - front-order
          - front-mypage
          - front-refund-request
          - front-invoice
          - front-cookie-consent
          - front-mail
          - front-password-nist
        include:
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 18

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      ## Docker Hub からの pull はタイムアウトで CI が不安定になるため、
      ## DB はコンテナではなく setup アクション (apt) でインストールする
      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@6d3ffa1aa7498a42b79e9f9f5838b99971839300  # v1
        with:
          postgres-version: '18'
          user: postgres
      - name: Configure PostgreSQL
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"
          ## DATABASE_URL と同一経路 (TCP/postgres/password) で接続できることを検証
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -c 'SELECT VERSION()'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis

      - name: Enable register_argc_argv for Codeception
        if: matrix.php == '8.5'
        run: |
          INI_FILE=$(php --ini | grep "Loaded Configuration" | sed -e "s|.*:\s*||" | tr -d '"')
          echo "Using php.ini: $INI_FILE"
          echo "register_argc_argv = On" | sudo tee -a "$INI_FILE"
          php -i | grep register_argc_argv

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Generate ECCUBE_AUTH_MAGIC
        run: echo "ECCUBE_AUTH_MAGIC=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Cache npm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        id: build-cache
        with:
          path: |
            html/template/**/css
            html/bundle
          key: ${{ runner.os }}-build-${{ hashFiles('html/template/**/scss/**/*.scss', 'html/template/**/js/**/*.js', 'package-lock.json', 'esbuild.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build Sass and JavaScript
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build

      - name: Setup to EC-CUBE
        env:
          APP_ENV: 'e2e'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          echo "APP_ENV=${APP_ENV}" > .env
          echo "TRUSTED_HOSTS=127.0.0.1,localhost" >> .env
          echo "ECCUBE_AUTH_MAGIC=${ECCUBE_AUTH_MAGIC}" >> .env
          bin/console doctrine:database:create
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # latest
        with:
          packages: fonts-ipafont fonts-ipaexfont
          version: 1.0

      - name: Start Mailpit (SMTP sink)
        uses: ./.github/actions/mailpit

      - name: Start PHP Development Server
        env:
          APP_ENV: 'e2e'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          MAILER_DSN: 'smtp://127.0.0.1:1025'
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: php -S 127.0.0.1:8000 codeception/router.php &

      - name: Determine Playwright project
        id: project
        run: |
          SUITE="${{ matrix.suite }}"
          if [[ "$SUITE" == admin-* ]]; then
            echo "project=admin-tests" >> $GITHUB_OUTPUT
          elif [[ "$SUITE" == front-* ]]; then
            echo "project=front-tests" >> $GITHUB_OUTPUT
          fi

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: 'http://127.0.0.1:8000'
          MAILPIT_URL: 'http://127.0.0.1:8025'
          DATABASE_URL: ${{ matrix.database_url }}
          ECCUBE_ADMIN_ROUTE: 'admin'
          ADMIN_USER: 'admin'
          ADMIN_PASSWORD: 'password'
          APP_ENV: 'e2e'
          CI: 'true'
        run: |
          npx playwright test --project=setup --project=${{ steps.project.outputs.project }} ${{ matrix.suite }}.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-${{ matrix.suite }}-report
          path: e2e/playwright-report/

      - name: Upload ScreenShots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-${{ matrix.suite }}-results
          path: e2e/test-results/

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-${{ matrix.suite }}-logs
          path: var/log/

  ## MCP の Playwright E2E。 トークン発行 UI → Bearer で /admin/mcp にツール呼び出し、 の経路を通す。
  ## MCP は Api44 (OAuth2 / scope / firewall) 前提のため、 メインの playwright マトリクスとは別に、
  ## Api44 を導入した専用環境で mcp.spec.ts を実走する (Api44 導入手順は unit-test.yml の mcp ジョブと同じ)。
  ## 環境は既存 playwright ジョブと同じ混成 (.env=e2e / スキーマ・fixtures・Api44 導入は --env=dev)。
  ## ブラウザ経由の admin ログインが通る実績のある構成に合わせる。
  mcp:
    name: Playwright (mcp)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      ## MCP の scope 認可と /admin/mcp 用 OAuth2 firewall は Api44 の feat/mcp-server-scorp に実装されており、
      ## eccube-api4 の 4.4 にはまだ無い。 当該ブランチが 4.4 にマージされたら ref を '4.4' に戻すこと。
      - name: Checkout Api44 plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          repository: 'EC-CUBE/eccube-api4'
          ref: 'feat/mcp-server-scorp'
          path: 'eccube-api4'

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@6d3ffa1aa7498a42b79e9f9f5838b99971839300  # v1
        with:
          postgres-version: '16'
          user: postgres
      - name: Configure PostgreSQL
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # v2
        with:
          php-version: '8.3'
          github-token: ''
          extensions: :xdebug, redis

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4
        with:
          node-version: 20

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Generate ECCUBE_AUTH_MAGIC
        run: echo "ECCUBE_AUTH_MAGIC=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build Sass and JavaScript
        run: |
          npm ci
          npm run build

      - name: Setup mock-package-api
        run: |
          ( cd eccube-api4 && tar cvzf "$GITHUB_WORKSPACE/Api44.tar.gz" ./* )
          mkdir -p /tmp/repos
          cp "$GITHUB_WORKSPACE/Api44.tar.gz" /tmp/repos/Api44.tgz
          docker run --name package-api -d -v /tmp/repos:/repos -e MOCK_REPO_DIR=/repos -p 8080:8080 eccube/mock-package-api:composer2

      # 既存 playwright ジョブと同じ混成: .env は e2e、 スキーマ/fixtures/Api44 導入は
      # --env=dev で流す (ブラウザ経由 admin ログインが通る実績のある構成)。
      - name: Setup EC-CUBE
        env:
          APP_ENV: 'e2e'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          DATABASE_SERVER_VERSION: 16
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          echo "APP_ENV=${APP_ENV}" > .env
          echo "TRUSTED_HOSTS=127.0.0.1,localhost" >> .env
          echo "ECCUBE_AUTH_MAGIC=${ECCUBE_AUTH_MAGIC}" >> .env
          bin/console doctrine:database:create --env=dev
          bin/console doctrine:schema:create --env=dev
          bin/console eccube:fixtures:load --env=dev

      - name: Install Api44
        env:
          APP_ENV: 'dev'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          DATABASE_SERVER_VERSION: 16
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          USE_SELFSIGNED_SSL_CERTIFICATE: '1'
        run: |
          bin/console doctrine:query:sql "update dtb_base_info set authentication_key='dummy'" --env=dev
          bin/console eccube:composer:require ec-cube/api44 --env=dev
          bin/console eccube:plugin:enable --code=Api44 --env=dev
          bin/console doctrine:schema:update --force --dump-sql --env=dev
          bin/console cache:clear --no-warmup --env=dev
          chmod 600 app/PluginData/Api44/oauth/private.key

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start PHP Development Server
        env:
          APP_ENV: 'e2e'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          DATABASE_SERVER_VERSION: 16
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: php -S 127.0.0.1:8000 codeception/router.php &

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: 'http://127.0.0.1:8000'
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          ECCUBE_ADMIN_ROUTE: 'admin'
          ADMIN_USER: 'admin'
          ADMIN_PASSWORD: 'password'
          APP_ENV: 'e2e'
          CI: 'true'
        run: npx playwright test --project=setup --project=mcp-tests mcp.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-mcp-report
          path: e2e/playwright-report/

      - name: Upload ScreenShots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-mcp-results
          path: e2e/test-results/

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-mcp-logs
          path: var/log/

  ## Web インストーラは「EC-CUBE が未インストールであること」が前提のため、
  ## playwright ジョブ (.env を作成し schema:create 済み) とは同居できず別ジョブにする。
  ## playwright ジョブとの違い:
  ##   - .env を作らない (index.php は .env が無いときだけ APP_ENV=install になる)
  ##   - APP_ENV を渡さない (渡すとインストール後も install 環境のままになり、
  ##     .env 生成後に prod へ切り替わることを検証できない)
  ##   - ECCUBE_AUTH_MAGIC を渡さない (渡すと isInstalled() が true になり、
  ##     step3 が存在しない dtb_base_info を SELECT して落ちる)
  ##   - データベースは空で作成するだけ (step5 の dropTables() はスキーマを
  ##     消すだけでデータベース自体は作らないため、作成は必要)
  playwright-installer:
    name: Playwright (installer)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ## 後続の Composer/npm/build でリポジトリ内のコードを実行するため、
          ## GitHub トークンを .git/config に残さない (このジョブは push しない)。
          persist-credentials: false

      - name: Setup PostgreSQL
        uses: ankane/setup-postgres@6d3ffa1aa7498a42b79e9f9f5838b99971839300  # v1
        with:
          postgres-version: '18'
          user: postgres
      - name: Configure PostgreSQL
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"
          ## インストーラの step4 が接続する空のデータベースを用意する
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE eccube_db'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Cache npm dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        id: build-cache
        with:
          path: |
            html/template/**/css
            html/bundle
          key: ${{ runner.os }}-build-${{ hashFiles('html/template/**/scss/**/*.scss', 'html/template/**/js/**/*.js', 'package-lock.json', 'esbuild.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-build-

      ## 完了画面の JS は install.bundle.js に依存するため、ビルドは必須
      - name: Build Sass and JavaScript
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build

      - name: Install Playwright dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # latest
        with:
          packages: fonts-ipafont fonts-ipaexfont
          version: 1.0

      ## インストール完了後は APP_ENV=prod となるが、prod の session cookie は
      ## cookie_samesite: none / cookie_secure: auto のため、HTTP では Secure が
      ## 付かずブラウザが cookie を破棄してしまい、管理画面にログインできない。
      ## php -S は HTTPS に対応していないため、TLS を張れる symfony CLI を使う。
      ##
      ## インストーラのスクリプトを curl | bash で実行するとサプライチェーン上の
      ## リスクがあるため、バージョンを固定してチェックサムを検証する。
      - name: Install Symfony CLI
        env:
          SYMFONY_CLI_VERSION: v5.17.1
          SYMFONY_CLI_SHA256: 526c26e029427a94f275f06298a12119ed95c7df037ca13b93f29405740d2f4e
        run: |
          curl -fsSL -o symfony-cli.tar.gz \
            "https://github.com/symfony-cli/symfony-cli/releases/download/${SYMFONY_CLI_VERSION}/symfony-cli_linux_amd64.tar.gz"
          echo "${SYMFONY_CLI_SHA256}  symfony-cli.tar.gz" | sha256sum -c -
          tar xzf symfony-cli.tar.gz symfony
          sudo install -m 0755 symfony /usr/local/bin/symfony
          rm -f symfony symfony-cli.tar.gz
          symfony version

      ## APP_ENV / ECCUBE_AUTH_MAGIC / DATABASE_URL は意図的に渡さない。
      ## .env が無い状態で起動することで APP_ENV=install となり、
      ## インストール完了後は生成された .env により APP_ENV=prod へ切り替わる。
      - name: Start Symfony web server (HTTPS)
        run: |
          ## composer install (Symfony Flex) が .env.dist から .env を生成し
          ## APP_ENV=prod / DATABASE_URL=sqlite になるため削除する。.env が無い
          ## ときだけ index.php は .env.install を読んで APP_ENV=install となり、
          ## Web インストーラが動作する。
          rm -f .env .env.local .env.local.php
          ## TLS 証明書を生成する (これを行わないと HTTP で起動してしまう)。
          ## ブラウザのトラストストアへの登録は certutil / ブラウザプロファイルを
          ## 必要とし CI ランナーでは失敗するが、証明書ファイル自体は生成される。
          ## Playwright 側は ignoreHTTPSErrors で自己署名証明書を受け入れるため、
          ## 登録失敗は無視してよい。証明書が生成されたことだけを検証する。
          symfony server:ca:install || true
          symfony server:start --port=8000 --daemon
          for _ in $(seq 1 30); do
            curl -ksSf -o /dev/null https://127.0.0.1:8000/install/step1 && break
            sleep 1
          done
          ## HTTPS で起動できていることを確認する。証明書生成に失敗していると
          ## HTTP でリッスンするため、この HTTPS リクエストが失敗して検知できる。
          curl -ksSf -o /dev/null https://127.0.0.1:8000/install/step1

      ## HTTPS で起動するため https。これによりインストール後 (APP_ENV=prod) の
      ## 管理画面ログインまで検証できる。
      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: 'https://127.0.0.1:8000'
          ## インストーラの step4 に入力する接続情報 (spec が組み立てに使う)
          DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/eccube_db
          CI: 'true'
        ## インストーラは冪等でない (1 回目でインストールが完了し .env が
        ## 生成されるため、リトライすると 2 回目は APP_ENV=prod になり別状態と
        ## なる)。リトライせず 1 回で判定する。
        run: npx playwright test --project=install-tests --retries=0

      - name: Stop Symfony web server
        if: always()
        run: symfony server:stop || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-installer-report
          path: e2e/playwright-report/

      - name: Upload ScreenShots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-installer-results
          path: e2e/test-results/

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: playwright-installer-logs
          path: var/log/
