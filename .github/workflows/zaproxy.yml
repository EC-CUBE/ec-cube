name: OWASP ZAP

# このGitHub Actionsワークフローは手動でトリガー可能です。
# 手動で実行するには、以下の手順に従ってください：
# 1. GitHubリポジトリの「Actions」タブに移動します。
# 2. 「OWASP ZAP」ワークフローを選択します。
# 3. 「Run workflow」ボタンをクリックします。
# 4. 必要に応じて、表示される入力フォームでパラメータを指定し、「Run workflow」を再度クリックして実行します。
#
# ターゲットの一覧と個別の設定 (before_script / context / thread_per_host) は zap/targets.json で管理します。
on:
  workflow_dispatch:
    inputs:
      policy:
        description: 'スキャンポリシー (Smoke は全ルールを OFF にして zst の再生だけを確認する)'
        type: choice
        options:
          - Sequence
          - Smoke
        default: Sequence
      targets:
        description: '実行するターゲットの正規表現 (zap/targets.json の target 全体に一致させる)'
        type: string
        default: '.*'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Build matrix
        id: matrix
        env:
          TARGETS: ${{ inputs.targets || '.*' }}
        run: |
          set -euo pipefail
          matrix=$(jq -c --arg re "^(${TARGETS})$" '[.[] | select(.target | test($re))]' zap/targets.json)
          if [[ $(jq length <<< "${matrix}") == 0 ]]; then
            echo "::error::'${TARGETS}' に一致するターゲットがありません"
            exit 1
          fi
          jq -r '.[].target' <<< "${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Container Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          tags: ec-cube
          outputs: type=docker,dest=/tmp/ec-cube.tar

      # --- EC-CUBE イメージのアップロード ---
      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ec-cube
          path: /tmp/ec-cube.tar

  scan:
    name: Scan (${{ matrix.target }})
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.pgsql.yml:docker-compose.owaspzap.ci.yml
      POLICY: ${{ inputs.policy || 'Sequence' }}
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ec-cube
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/ec-cube.tar
          docker tag ec-cube ghcr.io/ec-cube/ec-cube-php:8.2-apache

      # APP_ENV / APP_DEBUG は docker-compose.owaspzap.ci.yml で prod に上書きする
      - name: Run containers
        run: |
          docker compose up -d --wait
          docker compose cp zap/delete_data.sh postgres:/
          docker compose exec -d -e PGUSER=dbuser -e PGDATABASE=eccubedb postgres /delete_data.sh
          docker compose cp zap/delete_files.sh ec-cube:/
          docker compose exec -d ec-cube /delete_files.sh

      - name: Show ec-cube logs on failure
        if: failure()
        run: docker compose logs ec-cube --tail=200

      # バンドル版プラグインは 4.4 対応版のリリースが無いため、各リポジトリの 4.4 ブランチを導入する。
      # Securitychecker44 はリポジトリが非公開で匿名で clone できず、これを操作するシナリオも無いため導入しない
      - name: Set up plugins
        run: |
          set -euo pipefail
          plugins=(
            eccube-api4:api44:Api44
            coupon-plugin:coupon44:Coupon44
            mail-magazine-plugin:mailmagazine44:MailMagazine44
            ProductReview-plugin:productreview44:ProductReview44
            recommend-plugin:recommend44:Recommend44
            related-product-plugin:relatedproduct44:RelatedProduct44
            sales-report-plugin:salesreport44:SalesReport44
          )
          mkdir -p /tmp/repos
          for p in "${plugins[@]}"; do
            IFS=: read -r repo pkg code <<< "${p}"
            git clone --quiet --depth 1 --branch 4.4 "https://github.com/EC-CUBE/${repo}.git" "/tmp/repos/${repo}"
            # extra.id が無いと eccube:composer:require が失敗する
            jq '.extra.id = 0' "/tmp/repos/${repo}/composer.json" > /tmp/composer.json
            mv /tmp/composer.json "/tmp/repos/${repo}/composer.json"
          done
          docker compose cp /tmp/repos ec-cube:/var/www/repos
          docker compose exec -T -u 0:0 ec-cube chown -R www-data:www-data /var/www/repos
          for p in "${plugins[@]}"; do
            IFS=: read -r repo pkg code <<< "${p}"
            echo "::group::${code}"
            docker compose exec -T -u www-data:www-data ec-cube composer config "repositories.${pkg}" \
              "{\"type\":\"path\",\"url\":\"/var/www/repos/${repo}\",\"options\":{\"symlink\":false}}"
            docker compose exec -T -u www-data:www-data ec-cube bin/console eccube:composer:require "ec-cube/${pkg}"
            docker compose exec -T -u www-data:www-data ec-cube bin/console eccube:plugin:enable --code "${code}"
            # 前のプラグインを有効化した時点のコンテナキャッシュが残ると、次の有効化が失敗することがある
            docker compose exec -T -u www-data:www-data ec-cube bin/console cache:clear
            echo "::endgroup::"
          done

      - name: Disable rate limiter
        run: |
          docker compose exec -T -u www-data:www-data ec-cube sed -i -e "s/eccube_login_throttling_max_attempts: 5/eccube_login_throttling_max_attempts: 1024/" -e "s/eccube_login_throttling_interval: '30 minutes'/eccube_login_throttling_interval: '1 minutes'/" app/config/eccube/packages/eccube.yaml
          docker compose exec -T -u www-data:www-data ec-cube rm -f app/config/eccube/packages/prod/eccube_rate_limiter.yaml
          docker compose exec -T -u www-data:www-data ec-cube sed -i -e 's/30 min/1 min/g' app/config/eccube/packages/eccube_rate_limiter.yaml
          docker compose exec -T -u www-data:www-data ec-cube bin/console cache:clear
          docker compose exec -T -u www-data:www-data ec-cube bin/console debug:container --parameter eccube_login_throttling_max_attempts
          docker compose exec -T -u www-data:www-data ec-cube bin/console debug:container --parameter eccube_login_throttling_interval

      - name: Update and Install Add-ons
        run: |
          docker compose exec -T zap /zap/zap.sh -cmd -addonupdate
          docker compose exec -T zap /zap/zap.sh -cmd -addonuninstall sequence
          docker compose exec -T zap /zap/zap.sh -cmd -addoninstall sequence
          docker compose exec -T zap /zap/zap.sh -cmd -addoninstall automation
          docker compose exec -T zap /zap/zap.sh -cmd -addoninstall groovy

      # Smoke は同梱の Sequence ポリシーの全ルールを OFF にしたもの。能動スキャンをせず zst の再生だけを確認する
      - name: Create Smoke policy
        if: env.POLICY == 'Smoke'
        run: |
          docker compose exec -T zap sh -c "sed -e 's#<policy>Sequence</policy>#<policy>Smoke</policy>#' -e 's#<level>[A-Z]*</level>#<level>OFF</level>#g' -e 's#<enabled>true</enabled>#<enabled>false</enabled>#g' -e '/<statsId>/d' -e '/<readonly>/d' -e '/<locked>/d' /home/zap/.ZAP/policies/Sequence.policy > /home/zap/.ZAP/policies/Smoke.policy"

      # コンテキスト・ユーザー・before_script の既定値は generate_automation_config.sh が決める
      - name: Generate automation config
        env:
          ZAP_CONTEXT: ${{ matrix.context }}
          ZAP_BEFORE_SCRIPT: ${{ matrix.before_script }}
        run: |
          set -eu
          ZAP_POLICY=""
          if [[ ${POLICY} != Sequence ]]; then ZAP_POLICY=${POLICY}; fi
          zap/generate_automation_config.sh \
            -t "${TARGET}" \
            ${ZAP_BEFORE_SCRIPT:+-b "${ZAP_BEFORE_SCRIPT}"} \
            ${ZAP_CONTEXT:+-c "${ZAP_CONTEXT}"} \
            ${ZAP_POLICY:+-p "${ZAP_POLICY}"}
          cat "zap/automation/${TARGET}.yml"

      # connection.httpStateEnabled: before_script (standalone) でログインしたセッションをシナリオの再生へ引き継ぐ
      - name: Autorun
        id: autorun
        env:
          THREAD_PER_HOST: ${{ matrix.thread_per_host }}
        run: |
          set -o pipefail
          docker compose exec -T zap /zap/zap.sh \
            -cmd \
            -config anticsrf.tokens.token.name=_csrf_token \
            -config anticsrf.tokens.token.enabled=true \
            -config connection.httpStateEnabled=true \
            ${THREAD_PER_HOST:+-config scanner.threadPerHost=${THREAD_PER_HOST}} \
            -configfile /zap/wrk/options.properties \
            -autorun "/zap/wrk/automation/${TARGET}.yml" | tee /tmp/zap.log

      # 自動化プランは Zest のアサーション失敗 (passed = false) や変数の抽出失敗 (Assign: failed) があっても
      # 成功扱いになるため、ログから判定する。
      # Sequence では能動スキャンの攻撃が前のステップの状態を変えて再生が失敗することがあるため、警告に留める。
      # ログは options.properties の view.locale=ja_JP により日本語で出力される。
      - name: Check results
        if: ${{ !cancelled() && steps.autorun.outcome != 'skipped' }}
        run: |
          set -u
          status=0
          plan=成功
          if ! grep -q '自動化プランが成功' /tmp/zap.log; then
            plan=失敗
            echo "::error::自動化プランが失敗しました (High のアラート、またはジョブのエラー)"
            sed -n '/自動化プランの失敗/,$p' /tmp/zap.log
            status=1
          fi
          total=$(grep -c '^Response:' /tmp/zap.log || true)
          failures=$(grep -E 'passed = false|Assign: failed' /tmp/zap.log || true)
          count=0
          if [[ -n ${failures} ]]; then
            count=$(wc -l <<< "${failures}")
            level=warning
            if [[ ${POLICY} == Smoke ]]; then level=error; status=1; fi
            while IFS= read -r line; do echo "::${level}::${line}"; done <<< "${failures}"
          fi
          {
            echo "### ${TARGET} (${POLICY})"
            echo "- 自動化プラン: ${plan}"
            echo "- 再生の失敗: ${count} / ${total}"
          } >> "${GITHUB_STEP_SUMMARY}"
          exit ${status}

      - name: Debug app logs after autorun
        if: ${{ always() }}
        run: |
          echo "=== Docker Compose Logs (ec-cube) ==="
          docker compose logs ec-cube --tail=300 || true

          echo "=== Symfony prod log (directory and files) ==="
          docker compose exec -T ec-cube sh -lc 'ls -la var/log var/log/prod 2>/dev/null || true'

          echo "=== EC-CUBE site.log (last 300 lines) ==="
          docker compose exec -T ec-cube sh -lc 'tail -n 300 var/log/prod/site.log 2>/dev/null || true'

          echo "=== EC-CUBE admin.log (last 300 lines) ==="
          docker compose exec -T ec-cube sh -lc 'tail -n 300 var/log/prod/admin.log 2>/dev/null || true'

      - name: Copy report
        if: ${{ always() }}
        run: |
          mkdir -p /tmp/report
          docker compose cp zap:/tmp/report /tmp || true
          docker compose cp zap:/tmp/alerts.json /tmp || true
          cp /tmp/zap.log /tmp/report/ || true

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: zap-${{ matrix.target }}-report
          path: /tmp/report
          overwrite: true

      - name: Upload alerts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: zap-${{ matrix.target }}-alerts
          path: /tmp/alerts.json
          overwrite: true

  merge:
    name: Merge alerts
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: artifacts
          pattern: zap-*-alerts
      - name: Merge alerts
        working-directory: artifacts
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name 'alerts.json' -print0)

          if (( ${#files[@]} == 0 )); then
            echo "No alerts.json found under artifacts/" >&2
            find .
            exit 1
          fi

          jq -s 'add // []' "${files[@]}" > all_alerts.json
      - name: Upload alerts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: all_alerts
          path: artifacts/all_alerts.json
