name: OWASP ZAP

# このGitHub Actionsワークフローは手動でトリガー可能です。
# 手動で実行するには、以下の手順に従ってください：
# 1. GitHubリポジトリの「Actions」タブに移動します。
# 2. 「OWASP ZAP」ワークフローを選択します。
# 3. 「Run workflow」ボタンをクリックします。
# 4. 必要に応じて、表示される入力フォームでパラメータを指定し、「Run workflow」を再度クリックして実行します。
#
# ターゲットの一覧と個別の設定 (before_script / context / thread_per_host) は zap/targets.json で管理します。
on:
  workflow_dispatch:
    inputs:
      policy:
        description: 'スキャンポリシー (Smoke は全ルールを OFF にして zst の再生だけを確認する)'
        type: choice
        options:
          - Sequence
          - Smoke
        default: Sequence
      targets:
        description: '実行するターゲットの正規表現 (zap/targets.json の target 全体に一致させる)'
        type: string
        default: '.*'
      patches:
        description: 'スキャン用のパッチ (zap/patches/ のファイル名から .patch を除いたものを空白区切り。all ですべて。空なら当てない)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Lint zst
        run: zap/bin/lint_zst.sh

      - name: Build matrix
        id: matrix
        env:
          TARGETS: ${{ inputs.targets || '.*' }}
        run: |
          set -euo pipefail
          matrix=$(jq -c --arg re "^(${TARGETS})$" '[.[] | select(.target | test($re))]' zap/targets.json)
          if [[ $(jq length <<< "${matrix}") == 0 ]]; then
            echo "::error::'${TARGETS}' に一致するターゲットがありません"
            exit 1
          fi
          jq -r '.[].target' <<< "${matrix}"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Container Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          tags: ec-cube
          outputs: type=docker,dest=/tmp/ec-cube.tar

      # --- EC-CUBE イメージのアップロード ---
      - name: Upload image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: ec-cube
          path: /tmp/ec-cube.tar

  scan:
    name: Scan (${{ matrix.target }})
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.pgsql.yml:docker-compose.owaspzap.ci.yml
      POLICY: ${{ inputs.policy || 'Sequence' }}
      TARGET: ${{ matrix.target }}
      PATCHES: ${{ inputs.patches }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:

      - name: Maximize build space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4

      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: ec-cube
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/ec-cube.tar
          docker tag ec-cube ghcr.io/ec-cube/ec-cube-php:8.2-apache

      # APP_ENV / APP_DEBUG は docker-compose.owaspzap.ci.yml で prod に上書きする
      - name: Run containers
        run: |
          docker compose up -d --wait
          zap/bin/start_cleanup.sh

      - name: Show ec-cube logs on failure
        if: failure()
        run: docker compose logs ec-cube --tail=200

      # 導入するプラグインは zap/plugins.txt で管理する
      - name: Set up plugins
        run: zap/bin/install_plugins.sh /tmp/repos

      - name: Relax login throttling and rate limiter
        run: zap/bin/prepare_ec-cube.sh

      - name: Apply scan patches
        if: env.PATCHES != ''
        run: |
          if [[ ${PATCHES} == all ]]; then
            zap/bin/apply_patches.sh
          else
            # shellcheck disable=SC2086
            zap/bin/apply_patches.sh ${PATCHES}
          fi

      - name: Update and Install Add-ons
        run: zap/bin/prepare_zap.sh

      # プランの生成・実行・レポートの回収・結果の判定 (zap/bin/check_results.sh) をまとめて行う
      - name: Scan
        env:
          ZAP_CONTEXT: ${{ matrix.context }}
          ZAP_BEFORE_SCRIPT: ${{ matrix.before_script }}
          THREAD_PER_HOST: ${{ matrix.thread_per_host }}
        run: |
          zap/bin/autorun.sh -t "${TARGET}" -o /tmp/zap-out -p "${POLICY}" \
            ${ZAP_BEFORE_SCRIPT:+-b "${ZAP_BEFORE_SCRIPT}"} \
            ${ZAP_CONTEXT:+-c "${ZAP_CONTEXT}"} \
            ${THREAD_PER_HOST:+-n "${THREAD_PER_HOST}"}

      - name: Debug app logs after autorun
        if: ${{ always() }}
        run: |
          echo "=== Docker Compose Logs (ec-cube) ==="
          docker compose logs ec-cube --tail=300 || true

          echo "=== Symfony prod log (directory and files) ==="
          docker compose exec -T ec-cube sh -lc 'ls -la var/log var/log/prod 2>/dev/null || true'

          echo "=== EC-CUBE site.log (last 300 lines) ==="
          docker compose exec -T ec-cube sh -lc 'tail -n 300 var/log/prod/site.log 2>/dev/null || true'

          echo "=== EC-CUBE admin.log (last 300 lines) ==="
          docker compose exec -T ec-cube sh -lc 'tail -n 300 var/log/prod/admin.log 2>/dev/null || true'

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: zap-${{ matrix.target }}-report
          path: /tmp/zap-out
          overwrite: true

      - name: Upload alerts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: zap-${{ matrix.target }}-alerts
          path: /tmp/zap-out/alerts.json
          overwrite: true

  merge:
    name: Merge alerts
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: artifacts
          pattern: zap-*-alerts
      - name: Merge alerts
        working-directory: artifacts
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name 'alerts.json' -print0)

          if (( ${#files[@]} == 0 )); then
            echo "No alerts.json found under artifacts/" >&2
            find .
            exit 1
          fi

          jq -s 'add // []' "${files[@]}" > all_alerts.json
      - name: Upload alerts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: all_alerts
          path: artifacts/all_alerts.json
