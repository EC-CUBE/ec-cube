name: E2E test(Throttoling) for EC-CUBE

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codeception:
    name: Codeception
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        db: [ pgsql ]
        method: [ フロント画面ログイン_IP, フロント画面ログイン_会員, 管理画面ログイン_IP, 管理画面ログイン_会員, 会員登録, 問い合わせ, パスワード再発行, 注文確認_非会員購入, 注文確認_会員購入, 注文完了_非会員購入, 注文完了_会員購入, 会員情報編集, 配送先情報_追加, 配送先情報_編集, 配送先情報_削除, order_お届け先追加, order_お届け先変更, 新規会員登録_入力, 管理画面二段階認証 ]
        include:
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_server_version: 14
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      mailcatcher:
        image: schickling/mailcatcher
        ports:
          - 1080:1080
          - 1025:1025

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # codeception環境ではprodの設定が読み込まれないため、ベース設定を作成
      - name: Prepare rate limiter config
        run: |
          cp app/config/eccube/packages/prod/eccube_rate_limiter.yaml app/config/eccube/packages/codeception/eccube_rate_limiter.yaml

      # ShoppingController::checkoutをテストするため、confirmの上限値を変更する
      - name: Fix limiter limit
        if: startsWith(matrix.method, '注文完了')
        run: |
          echo "eccube:
              rate_limiter:
                  shopping_confirm_ip:
                      route: ~
                      limit: 1024
                      interval: '30 minutes'
                  shopping_confirm_customer:
                      route: ~
                      limit: 1024
                      interval: '30 minutes'
                  shopping_checkout_ip:
                      route: ~
                      limit: 25
                      interval: '30 minutes'
                  shopping_checkout_customer:
                      route: ~
                      limit: 10
                      interval: '30 minutes'" > app/config/eccube/packages/codeception/eccube_rate_limiter.yaml

      # delivery deleteのテストするため、delivery addの上限値を変更する
      - name: Fix limiter limi for delivery delete
        if: startsWith(matrix.method, '配送先情報_削除')
        run: |
          echo "eccube:
              rate_limiter:
                  mypage_delivery_new:
                      route: mypage_delivery_new
                      method: [ 'POST' ]
                      type: customer
                      limit: 1024
                      interval: '30 minutes'
                  mypage_delivery_delete:
                      route: mypage_delivery_delete
                      method: [ 'DELETE' ]
                      type: customer
                      limit: 10
                      interval: '30 minutes'" > app/config/eccube/packages/codeception/eccube_rate_limiter.yaml

      - name: Setup PHP
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1  # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis

      - name: Enable register_argc_argv for Codeception
        if: matrix.php == '8.5'
        run: |
          INI_FILE=$(php --ini | grep "Loaded Configuration" | sed -e "s|.*:\s*||" | tr -d '"')
          echo "Using php.ini: $INI_FILE"
          echo "register_argc_argv = On" | sudo tee -a "$INI_FILE"
          php -i | grep register_argc_argv

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Generate ECCUBE_AUTH_MAGIC
        run: echo "ECCUBE_AUTH_MAGIC=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Build Sass and JavaScript
        run: |
          npm ci
          npm run build

      - name: Setup to EC-CUBE
        env:
          APP_ENV: 'codeception'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          echo "APP_ENV=${APP_ENV}" > .env
          echo "TRUSTED_HOSTS=127.0.0.1,localhost" >> .env
          echo "ECCUBE_AUTH_MAGIC=${ECCUBE_AUTH_MAGIC}" >> .env
          bin/console doctrine:database:create --env=dev
          bin/console doctrine:schema:create --env=dev
          bin/console eccube:fixtures:load --env=dev

      - name: setup-chromedriver
        uses: nanasess/setup-chromedriver@fc3dc5897c11410827ed268ab625038ee63dc6fe  # master

      - name: Prepare Throttling Test
        run: |
          echo "framework:
              cache:
                  pools:
                      rate_limiter.cache:
                          adapter: cache.adapter.filesystem" > app/config/eccube/packages/codeception/rate_limiter.yml

      - name: Cache apt packages
        uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05  # latest
        with:
          packages: fonts-ipafont fonts-ipaexfont
          version: 1.0

      - name: Run chromedriver
        run: |
          export DISPLAY=:99
          chromedriver --url-base=/wd/hub --port=9515 &
          echo ">>> Started chrome-driver"
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          echo ">>> Started xvfb"

      - name: Start PHP Development Server
        env:
          APP_ENV: 'codeception'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          MAILER_DSN: 'smtp://127.0.0.1:1025'
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: php -S 127.0.0.1:8000 codeception/router.php &

      - name: Codeception
        env:
          APP_ENV: 'codeception'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          MAILER_DSN: 'smtp://127.0.0.1:1025'
          ECCUBE_PACKAGE_API_URL: 'http://127.0.0.1:8080'
          METHOD: ${{ matrix.method }}
          SYMFONY_DEPRECATIONS_HELPER: weak
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          sed -i "s|%GITHUB_WORKSPACE%|${GITHUB_WORKSPACE}|g" codeception/_envs/github_action.yml
          vendor/bin/codecept -vvv run acceptance --env chrome,github_action EF09ThrottlingCest::${METHOD} --html report.html

      - name: Upload evidence
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7
        with:
          name: codeception-${{ matrix.php }}-${{ matrix.method }}-evidence
          path: codeception/_output/
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7
        with:
          name: codeception-${{ matrix.php }}-${{ matrix.method }}-logs
          path: var/log/
