name: Testing dockerbuild
on:
  workflow_call:
    inputs:
      platforms:
        description: 'ビルド対象プラットフォームの JSON 配列。CI (PR/push) は amd64 のみ'
        type: string
        default: '["linux/amd64"]'
  release:
    types: [ published ]
env:
  REGISTRY: ghcr.io

jobs:
  dockerbuild:
    name: dockerbuild
    # プラットフォームごとのネイティブランナー。 QEMU エミュレーションは使わない
    # (arm64 を x86 上でエミュレートすると拡張のコンパイルで 20〜30 分かかるため)。
    # include で対応付けると、 amd64 のみの CI 時に arm64 の include が
    # どの組み合わせにも一致せず空のジョブを生むため、 式で解決する。
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # release 公開時のみ arm64 を含める。 workflow_call (CI) は既定の amd64 のみで、
        # ジョブ数・所要時間は従来と変わらない。
        platform: ${{ fromJSON(inputs.platforms || '["linux/amd64", "linux/arm64"]') }}
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        db: [ pgsql ]
        include:
          - db: pgsql
            database_url: postgres://dbuser:secret@127.0.0.1:15432/eccubedb
            database_server_version: 18
          - php: '8.2'
            tag: '8.2-apache'
            ext_install_args: 'zip gd mysqli pdo_mysql opcache intl'
          - php: '8.3'
            tag: '8.3-apache'
            ext_install_args: 'zip gd mysqli pdo_mysql opcache intl'
          - php: '8.4'
            tag: '8.4-apache'
            ext_install_args: 'zip gd mysqli pdo_mysql opcache intl'
          # PHP 8.5 以降は opcache がコア組み込みのため install 対象から除外する
          - php: '8.5'
            tag: '8.5-apache'
            ext_install_args: 'zip gd mysqli pdo_mysql intl'

    steps:
      - name: downcase REPO
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-php" >> ${GITHUB_ENV}
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> ${GITHUB_ENV}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false

      # ダイジェスト push (push-by-digest) は buildx の既定ドライバでは使えないため
      # docker-container ドライバのビルダーを用意する。 各アーキはネイティブランナーで
      # ビルドするため QEMU (docker/setup-qemu-action) は不要。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for default branch
            type=raw,value=${{ matrix.php }}-apache,prefix=,enable={{is_default_branch}}
            type=ref,event=branch,prefix=${{ matrix.php }}-apache-
            type=ref,event=tag,prefix=${{ matrix.php }}-apache-
            type=ref,event=pr,prefix=${{ matrix.php }}-apache-pr-

      # load (docker へのロード) は単一プラットフォームでしか行えないため、
      # 起動確認は amd64 (ランナーと同一アーキ) でのみ実施する。
      - name: Build and export to Docker
        if: matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ matrix.tag }}
            EXT_INSTALL_ARGS=${{ matrix.ext_install_args }}

      - name: Setup to EC-CUBE
        if: matrix.platform == 'linux/amd64'
        env:
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.pgsql.yml up -d --wait
          sed -i 's!APP_ENV: "dev"!APP_ENV: "prod"!g' docker-compose.yml
          sed -i 's!APP_DEBUG: 1!APP_DEBUG: 0!g' docker-compose.yml
          docker compose -f docker-compose.yml -f docker-compose.pgsql.yml up -d --wait

      ## see https://docs.github.com/ja/packages/managing-github-packages-using-github-actions-workflows/publishing-and-installing-a-package-with-github-actions#publishing-a-package-using-an-action

      # アーキごとにタグ無しでダイジェストのみ push し、 merge ジョブでマニフェストを束ねる。
      - name: Build and push by digest
        id: build
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAG=${{ matrix.tag }}
            EXT_INSTALL_ARGS=${{ matrix.ext_install_args }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: digests-${{ matrix.php }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ダイジェストをマニフェストリストに束ねてタグを付ける。
  # 単一プラットフォーム (CI) でも同じ経路を通り、 結果は従来と同じタグになる。
  merge:
    name: merge ${{ matrix.php }}
    needs: dockerbuild
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: downcase REPO
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-php" >> ${GITHUB_ENV}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.php }}-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # set latest tag for default branch
            type=raw,value=${{ matrix.php }}-apache,prefix=,enable={{is_default_branch}}
            type=ref,event=branch,prefix=${{ matrix.php }}-apache-
            type=ref,event=tag,prefix=${{ matrix.php }}-apache-
            type=ref,event=pr,prefix=${{ matrix.php }}-apache-pr-

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
