name: PHP CS Fixer

on:
  workflow_call:

jobs:
  php-cs-fixer:
    name: Run PHP CS Fixer
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: nanasess/setup-php@master
        with:
          php-version: '8.3'

      - name: Install ext-redis 6.1+
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-redis
          sudo phpenmod -s cli redis
          php -m | grep -i redis

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Run php-cs-fixer (dry-run)
        # ─── 差分があるとステップごと失敗させる ───
        run: |
          php vendor/bin/php-cs-fixer fix --diff --dry-run --allow-risky=yes --using-cache=no
