name: Docs Check

# コード近接ドキュメント（README.html / README.md）の鮮度チェック（Issue #6906 §8.2）。
# section 属性の欠落・相対リンク切れを検出する。README/ドキュメント変更時のみ実行。

on:
  push:
    paths:
      - '**/README.html'
      - '**/README.md'
      - '.github/bin/check-readme-docs.php'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**/README.html'
      - '**/README.md'
      - '.github/bin/check-readme-docs.php'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  docs-check:
    name: Check colocated README docs
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: '8.5'

      - name: Check README.html / README.md (section attributes & relative links)
        run: php .github/bin/check-readme-docs.php
