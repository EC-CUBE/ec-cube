name: Unit test for EC-CUBE

on:
  workflow_call:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ${{ matrix.operating-system }}
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ ubuntu-24.04 ]
        php: [ '8.2', '8.3', '8.4', '8.5' ]
        db: [ mysql, pgsql, pgsql13, sqlite3 ]
        include:
          ## database_version: setup アクションでインストールするバージョン
          ## database_server_version: Doctrine の server_version 設定値
          - db: mysql
            database_url: mysql://root:password@127.0.0.1:3306/eccube_db
            database_version: '8.4'
            database_server_version: 8
            database_charset: utf8mb4
          - db: pgsql
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_version: '18'
            database_server_version: 18
            database_charset: utf8
          # サポート最小バージョンの PostgreSQL でも検証する
          - db: pgsql13
            database_url: postgres://postgres:password@127.0.0.1:5432/eccube_db
            database_version: '13'
            database_server_version: 13
            database_charset: utf8
          - db: sqlite3
            database_url: sqlite:///var/eccube.db
            database_server_version: 3
            database_charset: utf8

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      # CVE-2026-24765 (GHSA-vvj3-c3rp-c85p) 対策 (多層防御):
      # 悪意ある *.coverage ファイルが PHPUnit の PHPT ランナーで unserialize され
      # RCE に至るのを防ぐため、テスト実行前に削除する。
      - name: Remove potentially malicious coverage files
        run: find . -name "*.coverage" -delete

      ## Docker Hub からの pull はタイムアウトで CI が不安定になるため、
      ## DB はコンテナではなく setup アクション (apt/同梱版) でインストールする
      - name: Setup MySQL
        if: matrix.db == 'mysql'
        uses: ankane/setup-mysql@7fef9e1e6d7041dccbe4cda8e2c5940e49db8f30  # v1
        with:
          mysql-version: ${{ matrix.database_version }}
      - name: Configure MySQL
        if: matrix.db == 'mysql'
        run: |
          for _ in $(seq 1 30); do mysqladmin ping -h 127.0.0.1 --silent && break; sleep 1; done
          mysqladmin ping -h 127.0.0.1 --silent || { echo 'MySQL did not become ready within 30s'; exit 1; }
          ## DATABASE_URL は TCP(127.0.0.1) 接続のため、TCP 経路でアクセスする root@'%' にも認証情報を設定する
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH caching_sha2_password BY 'password'; CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED WITH caching_sha2_password BY 'password'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;"
          ## DATABASE_URL と同一経路 (TCP/root/password) で接続できることを検証
          mysql -h 127.0.0.1 -P 3306 -u root -ppassword -e 'SELECT VERSION()'

      - name: Setup PostgreSQL
        if: startsWith(matrix.db, 'pgsql')
        uses: ankane/setup-postgres@6d3ffa1aa7498a42b79e9f9f5838b99971839300  # v1
        with:
          postgres-version: ${{ matrix.database_version }}
          user: postgres
      - name: Configure PostgreSQL
        if: startsWith(matrix.db, 'pgsql')
        run: |
          for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 && break; sleep 1; done
          pg_isready -h 127.0.0.1 || { echo 'PostgreSQL did not become ready within 30s'; exit 1; }
          psql -h 127.0.0.1 -U postgres -c "ALTER USER postgres PASSWORD 'password'"
          ## DATABASE_URL と同一経路 (TCP/postgres/password) で接続できることを検証
          PGPASSWORD=password psql -h 127.0.0.1 -U postgres -c 'SELECT VERSION()'

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: ${{ matrix.php }}
          github-token: ''
          extensions: :xdebug, redis
      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Generate ECCUBE_AUTH_MAGIC
        run: echo "ECCUBE_AUTH_MAGIC=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Cache Database Schema
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        id: schema-cache
        with:
          path: |
            var/cache/test/schema.sql
            var/cache/test/db_populated
          key: ${{ runner.os }}-schema-${{ hashFiles('src/Eccube/Entity/**/*.php', 'app/Customize/Entity/**/*.php') }}
          restore-keys: |
            ${{ runner.os }}-schema-

      - name: Setup EC-CUBE
        env:
          APP_ENV: 'test'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          ECCUBE_AUTH_MAGIC: ${{ env.ECCUBE_AUTH_MAGIC }}
        run: |
          bin/console doctrine:database:create
          bin/console doctrine:schema:create
          bin/console eccube:fixtures:load

      # Agent Commerce (#6794) の UCP スキーマ契約テスト用に UCP 公式 schema を取得する。
      # リポジトリには同梱しない (Apache-2.0)。docblock の参照バージョンと一致するリリースタグ
      # v2026-04-08 に固定し、var/ (gitignore) へ clone する。未取得環境では該当テストは skip。
      - name: Fetch UCP spec schemas (tag v2026-04-08)
        run: |
          git clone --filter=blob:none --branch v2026-04-08 --single-branch --quiet \
            https://github.com/Universal-Commerce-Protocol/ucp.git var/agent-commerce-spec/ucp

      - name: PHPUnit
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_on: error
          command: vendor/bin/phpunit --exclude-group cache-clear --exclude-group cache-clear-install --exclude-group update-schema-doctrine --exclude-group plugin-service
        env:
          APP_ENV: 'test'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          MAILER_URL: 'smtp://127.0.0.11025'
      - name: PHPUnit (cache-clear)
        env:
          APP_ENV: 'test'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          MAILER_URL: 'smtp://127.0.0.11025'
        run: |
          echo "session.save_path=$PWD/var/sessions/test" > php.ini
          echo "memory_limit=512M" >> php.ini
          php -c php.ini vendor/bin/phpunit --group cache-clear
          php -c php.ini vendor/bin/phpunit --group cache-clear-install
      - name: PHPUnit (update-schema-doctrine)
        if: startsWith(matrix.db, 'pgsql')
        env:
          APP_ENV: 'test'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          MAILER_URL: 'smtp://127.0.0.11025'
        run: |
          echo "session.save_path=$PWD/var/sessions/test" > php.ini
          echo "memory_limit=512M" >> php.ini
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine --exclude-group update-schema-doctrine-install
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine-install --filter=testInstallPluginWithNoProxy
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine-install --filter=testInstallPluginWithProxy
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine-install --filter=testEnablePluginWithNoProxy
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine-install --filter=testEnablePluginWithProxy
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine-install --filter=testDisablePluginWithNoProxy
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine-install --filter=testDisablePluginWithProxy
          php -c php.ini vendor/bin/phpunit --group update-schema-doctrine-install --filter=testCreateEntityAndTrait
      ## XXX MySQL で Syntax error or access violation: 1305 SAVEPOINT DOCTRINE2_SAVEPOINT_3 does not exist が
      ## 発生するため \DAMA\DoctrineTestBundle\PHPUnit\PHPUnitListener を削除する
      ## see https://github.com/dmaicher/doctrine-test-bundle/issues/58#issuecomment-391081408
      - run: sed -e '/DoctrineTestBundle/d' phpunit.xml.dist > phpunit.xml
        if: ${{ matrix.db == 'mysql' }}
      - name: PHPUnit (plugin-service)
        env:
          APP_ENV: 'test'
          DATABASE_URL: ${{ matrix.database_url }}
          DATABASE_SERVER_VERSION: ${{ matrix.database_server_version }}
          DATABASE_CHARSET: ${{ matrix.database_charset }}
          MAILER_URL: 'smtp://127.0.0.11025'
        run: |
          rm -r app/Plugin/*
          git checkout app/Plugin
          rm -r var/cache
          echo "session.save_path=$PWD/var/sessions/test" > php.ini
          echo "memory_limit=512M" >> php.ini
          php -c php.ini vendor/bin/phpunit --group plugin-service
