# 利用者から見た機能の一覧（Issue #7225）
#
# このファイルが正本です。README.html は生成物なので直接編集しないでください。
# 編集したら次のコマンドで README.html を作り直し、両方をコミットします。
#
#   php .github/bin/feature-list.php            # README.html を生成
#   php .github/bin/feature-list.php --check    # 検証のみ（CI の docs-check と同じ）
#
# 列の意味
#   id      機能 ID。FR=フロント（購入者） / AD=管理画面（店舗運営者） / DV=開発者・運用者（CLI・API・拡張）。
#           接頭辞ごとの 3 桁連番。採番したら変えない。機能を廃止しても行は消さず removed を付ける（欠番にする）。
#           新しい行は、その接頭辞の最大の番号 +1 を振る（並び順は group でまとめてよく、番号順でなくてよい）。
#   group   HTML で見出しにまとめる単位（管理画面ならメニュー名）
#   name    利用者から見た機能の名前
#   summary 1〜2 行の概要
#   dirs    関連するディレクトリまたはファイル（リポジトリルートからの相対パス）。
#           README.html があるディレクトリはそこへリンクする。
#   since   導入バージョン。4.4 より前からある機能は書かない。
#   prs     機能を追加・変更した本体 PR を、リリースのバージョンごとに並べる。不具合修正だけの PR は書かない。
#   removed 機能を廃止したバージョン（任意）
#
# 4.4 より前からある機能は since と prs を空にしている（Issue #7225 の進め方 2）。

features:
